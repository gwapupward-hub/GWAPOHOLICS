name: Mobile browser smoke
on:
  push:
    branches: [feat/season1-brand-backlash-cinematic]
  pull_request:
permissions:
  contents: read
jobs:
  chromium-portrait:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser test driver (CI only)
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          npm run dev > /tmp/gwapoholics-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/?demo=1 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gwapoholics-dev.log
          exit 1
      - name: Exercise five missions in mobile-sized browser
        run: node --test tests/browser/*.e2e.mjs
