name: Encrypted Neon Preview backup

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: gwapoholics-preview-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview-backup
    env:
      B2_BUCKET: gwapoholics-db-backups
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_BACKUP_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: us-east-005
      DATABASE_URL: ${{ secrets.NEON_PREVIEW_BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Validate backup configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AGE_RECIPIENT; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing required configuration: $name"; exit 1; fi
          done
          [[ "$AGE_RECIPIENT" == age1* ]] || { echo "::error::Invalid age recipient"; exit 1; }
          aws --version
      - name: Checkout audited backup guardrails
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fail closed unless source is the approved Preview endpoint
        shell: bash
        run: node scripts/verify-backup-source.mjs
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Dump Preview PostgreSQL using PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gwap-backup"
          chmod 700 "$RUNNER_TEMP/gwap-backup"
          docker run --rm --network host \
            --env DATABASE_URL \
            --mount "type=bind,src=$RUNNER_TEMP/gwap-backup,dst=/out" \
            postgres:18 \
            bash -euc '
              source_db="$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT current_database()")"
              [[ "$source_db" == "neondb" ]] || { echo "::error::Wrong backup database"; exit 1; }
              counts="$(psql "$DATABASE_URL" -At -F " " -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM public.players), (SELECT count(*) FROM public.quest_runs), (SELECT count(*) FROM public.virtual_ledger), (SELECT count(*) FROM public.command_receipts)")"
              read -r players quests ledger receipts <<< "$counts"
              for value in "$players" "$quests" "$ledger" "$receipts"; do
                [[ "$value" =~ ^[0-9]+$ ]] || { echo "::error::Invalid game table count"; exit 1; }
              done
              if (( players < 1 || quests < 1 || ledger < 1 || receipts < 1 )); then
                echo "::error::Preview backup source has empty game tables; refusing to upload an empty recovery archive."
                exit 1
              fi
              echo "Verified populated Preview game tables; source checks passed."
              pg_dump --dbname="$DATABASE_URL" --schema=public --format=custom --no-owner --no-acl --file=/out/preview.dump
            '
          test -s "$RUNNER_TEMP/gwap-backup/preview.dump"
      - name: Reject any archive lacking game COPY records
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount "type=bind,src=$RUNNER_TEMP/gwap-backup,dst=/out,readonly" \
            postgres:18 \
            pg_restore --data-only --schema=public --file=- /out/preview.dump \
            | node scripts/audit-backup-copy.mjs
      - name: Encrypt and upload immutable backup
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/gwap-backup"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          name="gwapoholics-preview-${stamp}-${GITHUB_RUN_ID}.dump.age"
          age --recipient "$AGE_RECIPIENT" --output "$work/$name" "$work/preview.dump"
          sha256sum "$work/$name" | awk '{print $1}' > "$work/$name.sha256"
          aws --endpoint-url "$B2_ENDPOINT" s3 cp "$work/$name" "s3://$B2_BUCKET/postgres/$name" --no-progress
          aws --endpoint-url "$B2_ENDPOINT" s3 cp "$work/$name.sha256" "s3://$B2_BUCKET/postgres/$name.sha256" --no-progress
          echo "Encrypted archive and SHA256 checksum uploaded: postgres/$name"
          echo "Verify bucket Object Lock default retention and restore independently before considering this production-ready."
      - name: Remove local dump
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/gwap-backup"
