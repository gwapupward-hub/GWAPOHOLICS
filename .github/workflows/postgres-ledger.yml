name: PostgreSQL ledger integration
on:
  pull_request:
  push:
    branches: [feat/v1-private-beta-release-candidate]
permissions:
  contents: read
jobs:
  postgres-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gwap_ci
          POSTGRES_PASSWORD: ci-only-disposable-secret
          POSTGRES_DB: gwapoholics_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gwap_ci -d gwapoholics_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      GWAPOHOLICS_TEST_DATABASE_URL: postgresql://gwap_ci:ci-only-disposable-secret@127.0.0.1:5432/gwapoholics_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install database driver
        run: npm install --no-audit --no-fund
      - name: Exercise real Postgres transactions with disposable test data
        run: node --test tests/integration/postgres-ledger.test.mjs
