name: Experimental Tone Audio Lab
on:
  push:
    branches:
      - feature/v21-adaptive-audio-director-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check && node --test tests/audio-director.test.mjs tests/tone-adapter.test.mjs
      - name: Build local experimental bundle
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund tone@15 esbuild@0.25
          mkdir -p vendor
          ./node_modules/.bin/esbuild node_modules/tone/build/esm/index.js --bundle --format=esm --platform=browser --outfile=vendor/tone.mjs
          node --input-type=module -e 'import { stat } from "node:fs/promises"; const s=await stat("vendor/tone.mjs"); console.log("Experimental bundle bytes:",s.size); if(s.size>1500000) process.exit(1)'
          npm ls tone esbuild --depth=0 || true
      - name: Upload experimental bundle (not deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: experimental-tone-audio-lab
          path: vendor/tone.mjs
          retention-days: 3
